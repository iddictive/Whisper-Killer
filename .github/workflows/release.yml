name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Release
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
            .build/workspace-state.json
          key: swiftpm-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Test
        run: swift test --disable-keychain --disable-netrc

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Calculate Version
        id: versioning
        run: |
          source scripts/version.sh
          APP_VERSION="$(next_release_version Sources/WhisperFree/Resources/Info.plist)"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "VERSION=$APP_VERSION" >> $GITHUB_OUTPUT
          WHISPERKILLER_VERSION="$APP_VERSION" resolve_whisperkiller_version Sources/WhisperFree/Resources/Info.plist

      - name: Build App
        run: |
          swift build -c release --disable-keychain --disable-netrc
          mkdir -p WhisperKiller.app/Contents/MacOS
          mkdir -p WhisperKiller.app/Contents/Resources

          # Find the binary dynamically
          echo "🔍 Looking for binary: WhisperKiller in .build/..."
          ACTUAL_BINARY=$(find .build -name "WhisperKiller" -type f -not -path "*.dSYM*" 2>/dev/null | grep -i "/release/" | head -n 1)

          if [ -z "$ACTUAL_BINARY" ]; then
            echo "❌ Binary not found!"
            find .build -name "WhisperKiller" -type f 2>/dev/null
            exit 1
          fi
          echo "Found binary at: $ACTUAL_BINARY"

          cp "$ACTUAL_BINARY" WhisperKiller.app/Contents/MacOS/
          chmod +x WhisperKiller.app/Contents/MacOS/WhisperKiller

          cp Sources/WhisperFree/Resources/Info.plist WhisperKiller.app/Contents/
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable WhisperKiller" "WhisperKiller.app/Contents/Info.plist"

          if [ -d Sources/WhisperFree/Resources/Profanity ]; then
            mkdir -p WhisperKiller.app/Contents/Resources/Resources
            ditto --norsrc --noextattr Sources/WhisperFree/Resources/Profanity WhisperKiller.app/Contents/Resources/Resources/Profanity
          fi

          if [ -f Sources/WhisperFree/Resources/AppIcon.icns ]; then
            cp Sources/WhisperFree/Resources/AppIcon.icns WhisperKiller.app/Contents/Resources/
          fi

          # Ad-hoc sign after all files are in place.
          rm -rf WhisperKiller.app/Contents/_CodeSignature
          dot_clean -m WhisperKiller.app 2>/dev/null || true
          find WhisperKiller.app -name '._*' -delete
          find WhisperKiller.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          codesign --force --deep --sign - WhisperKiller.app || {
            echo "First signing pass failed after xattr cleanup. Retrying once..."
            rm -rf WhisperKiller.app/Contents/_CodeSignature
            dot_clean -m WhisperKiller.app 2>/dev/null || true
            find WhisperKiller.app -name '._*' -delete
            find WhisperKiller.app -print0 | xargs -0 xattr -c 2>/dev/null || true
            codesign --force --deep --sign - WhisperKiller.app
          }
          dot_clean -m WhisperKiller.app 2>/dev/null || true
          find WhisperKiller.app -name '._*' -delete
          find WhisperKiller.app -print0 | xargs -0 xattr -c 2>/dev/null || true
          codesign --verify --deep --strict WhisperKiller.app

      - name: Create DMG
        run: bash scripts/create_dmg.sh "WhisperKiller.app" "WhisperKiller-${{ env.APP_VERSION }}.dmg" "WhisperKiller"

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: WhisperKiller v${{ env.APP_VERSION }}
          files: |
            WhisperKiller-${{ env.APP_VERSION }}.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
